<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>NISE SONIC</title>
  <meta name="description" content="ブラウザで遊べる、ハリネズミの高速2Dアクション（ファンメイド）">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="wrap">
    <canvas id="screen" width="320" height="224" aria-label="ゲーム画面"></canvas>
  </main>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-btn="up" class="b-up">▲</button>
      <button data-btn="left" class="b-left">◀</button>
      <button data-btn="right" class="b-right">▶</button>
      <button data-btn="down" class="b-down">▼</button>
    </div>
    <button data-btn="start" class="b-start">START</button>
    <button data-btn="jump" class="b-jump">A</button>
  </div>

  <script src="js/pixel.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/player.js"></script>
  <script src="js/render.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
